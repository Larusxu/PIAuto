[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "piauto"
version = "0.1.0"
description = "Hardware-neutral motor PI tuning: V1 assisted, V2 model-based"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11", "control>=0.10"]
[project.optional-dependencies]
ui = ["streamlit>=1.35", "pandas>=2.0", "matplotlib>=3.7"]
test = ["pytest>=8"]
[project.scripts]
piauto = "piauto.cli:main"
piauto-v2 = "piauto.v2.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
