name: Python validation
on:
  push:
    branches: [main, complete-v1-v2-adapter]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q
      - name: Smoke commands
        run: |
          piauto --help
          piauto-v2 --help
          piauto v1-mock --approve
          piauto-v2 full-mock --approve --dq shared --max-rounds 1
          piauto-v2 full-mock --approve --dq independent --max-rounds 1
